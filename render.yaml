services:
  - type: web
    name: forragem-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm install
      npx prisma generate
    startCommand: npm run dev
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 5min
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
